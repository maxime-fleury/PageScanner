<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageScanner - Blacklist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-crosshair-2 text-success me-2"></i>PageScanner
      </a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/gallery.html">Gallery</a>
        <a class="nav-link active" href="/blacklist.html">Blacklist</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card bg-dark border-secondary">
          <div class="card-body">
            <h5 class="card-title mb-4">
              <i class="bi bi-shield-x text-danger me-2"></i>Blacklist Keywords
            </h5>
            <form id="add-keyword-form" class="input-group mb-4">
              <input type="text" id="keyword-input" class="form-control bg-dark text-light border-secondary"
                placeholder="Enter keyword (e.g. login, nginx, cpanel)" autocomplete="off">
              <button type="submit" class="btn btn-danger">
                <i class="bi bi-plus-lg me-1"></i>Add
              </button>
            </form>

            <div id="keywords-list" class="d-flex flex-wrap gap-2"></div>

            <div id="no-keywords" class="text-muted text-center py-3">
              No blacklist keywords defined
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card bg-dark border-secondary">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5 class="card-title mb-0">
                <i class="bi bi-shield-slash text-warning me-2"></i>Blacklisted Domains
              </h5>
              <button id="btn-recheck" class="btn btn-sm btn-outline-warning">
                <i class="bi bi-arrow-clockwise me-1"></i>Re-check All
              </button>
            </div>
            <div id="blacklisted-domains" class="list-group"></div>
            <div id="no-blacklisted" class="text-muted text-center py-3">
              No blacklisted domains
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/blacklist.js"></script>
</body>
</html>
