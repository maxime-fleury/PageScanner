<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageScanner - Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-crosshair-2 text-accent me-2"></i>PageScanner
      </a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link active" href="/gallery.html">Gallery</a>
        <a class="nav-link" href="/blacklist.html">Blacklist</a>
        <a class="nav-link" href="/interesting.html">Discoveries</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">Screenshot Gallery</h4>
      <div class="d-flex gap-2 align-items-center">
        <select id="filter-select" class="form-select form-select-sm bg-dark text-light border-secondary" style="width:auto">
          <option value="">All domains</option>
          <option value="screenshotted_clean">Screenshotted &amp; Clean</option>
          <option value="screenshotted">Screenshotted only</option>
          <option value="pending">Pending only</option>
          <option value="shown">Shown (not blacklisted)</option>
          <option value="blacklisted">Blacklisted only</option>
        </select>
        <div class="input-group input-group-sm" style="width:auto">
          <span class="input-group-text bg-dark text-light border-secondary" style="font-size:0.75rem">Cols</span>
          <select id="grid-size" class="form-select form-select-sm bg-dark text-light border-secondary" style="width:70px">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>
        <button id="btn-refresh" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>

    <div id="gallery-grid" class="row g-3"></div>

    <div id="no-gallery" class="text-center text-muted py-5">
      <i class="bi bi-images fs-1 d-block mb-2"></i>
      No screenshots yet. Start the crawler from the dashboard.
    </div>

    <div id="scroll-sentinel" class="text-center py-3" style="display:none">
      <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="modal fade" id="lightbox" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content bg-dark border-secondary">
        <div class="modal-header border-secondary">
          <div>
            <h5 class="modal-title font-mono" id="lb-domain"></h5>
            <small class="text-muted" id="lb-title"></small>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <span id="lb-badge" class="badge"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
        </div>
        <div class="modal-body text-center p-0">
          <img id="lb-image" class="img-fluid" style="max-height:70vh; object-fit:contain;">
        </div>
        <div class="modal-footer border-secondary d-flex justify-content-between">
          <div class="text-muted small font-mono" id="lb-meta"></div>
          <div class="d-flex gap-2 align-items-center">
            <div class="input-group input-group-sm" style="width:220px">
              <input type="text" id="lb-title-input" class="form-control bg-dark text-light border-secondary" style="font-size:0.75rem" placeholder="Title to blacklist">
              <button id="lb-block-title" class="btn btn-sm btn-outline-warning" title="Add title as blacklist keyword">
                <i class="bi bi-shield-slash"></i> Block
              </button>
            </div>
            <button id="lb-toggle-bl" class="btn btn-sm btn-outline-warning">
              <i class="bi bi-shield-slash me-1"></i>Blacklist
            </button>
            <a id="lb-visit" href="#" target="_blank" class="btn btn-sm btn-outline-info">
              <i class="bi bi-box-arrow-up-right me-1"></i>Visit
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
